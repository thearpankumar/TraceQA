# Weekly update pull requests for every ecosystem in the repository. Minor and patch updates
# arrive together in one pull request per ecosystem; a major update gets its own. A new release
# waits seven days, so a hijacked or yanked release is usually gone before it is proposed.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # The Python packages of the workspace share one lock file, uv.lock, at the root.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # The TypeScript SDK (sdks/typescript) was removed; kept commented out.
  # - package-ecosystem: npm
    # directory: /sdks/typescript
    # schedule:
      # interval: weekly
    # open-pull-requests-limit: 5
    # cooldown:
      # default-days: 7
    # commit-message:
      # prefix: "chore(deps)"
    # groups:
      # npm-minor-patch:
        # update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
