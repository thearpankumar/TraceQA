name: Audit

# Known vulnerabilities in the dependencies, found by looking them up, not by building anything.
# It runs every week, because new advisories appear without any change here, and whenever a
# lock file or the policy changes. It always runs on GitHub-hosted machines.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - uv.lock
      - sdks/typescript/package-lock.json
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - uv.lock
      - sdks/typescript/package-lock.json
      - deny.toml
      - .github/workflows/audit.yml

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_AUDIT_VERSION: 2.10.1

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The same pinned versions as the release workflow.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Known vulnerabilities
        run: cargo audit --file Cargo.lock
      - name: Licences, bans and sources
        run: cargo deny --locked check

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Audit the locked packages
        run: |
          # The lock file as a requirements list, without the workspace's own packages.
          uv export --frozen --no-hashes --no-emit-workspace --no-header > "$RUNNER_TEMP/requirements.txt"
          uvx "pip-audit==$PIP_AUDIT_VERSION" -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit the locked packages
        working-directory: sdks/typescript
        run: npm audit --audit-level=high --package-lock-only
