name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Style and generated code. These do not depend on the operating system, so they run once.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Install the TypeScript tools
        working-directory: sdks/typescript
        run: npm ci

      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Python lint
        run: uv run ruff check .
      - name: Python format
        run: uv run ruff format --check .
      - name: Generated Python types match spec/
        run: uv run scripts/gen_python_protocol.py --check
      - name: Generated TypeScript types match spec/
        working-directory: sdks/typescript
        run: npm run gen:check
      - name: TypeScript type check
        working-directory: sdks/typescript
        run: npm run typecheck

  # Everything that runs: the Rust crates, the release binary, both drivers, both SDKs and the bench.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One system failing should not hide what the others do.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: traceqa
            artifact: traceqa-linux-x86_64
          - os: macos-latest
            binary: traceqa
            artifact: traceqa-macos-arm64
          - os: windows-latest
            binary: traceqa.exe
            artifact: traceqa-windows-x86_64
    env:
      # The SDK tests and the bench use the release binary: the same file that is uploaded below.
      TRACEQA_BIN: ${{ github.workspace }}/target/release/${{ matrix.binary }}
      # The stand-in engine that plays back spec/transcripts/ to both SDKs.
      TRACEQA_REPLAY_BIN: ${{ github.workspace }}/target/release/traceqa-replay${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      # The WebDriver driver is tested against chromedriver. Missing chromedriver is a failure, not a skip.
      TRACEQA_REQUIRE_CHROMEDRIVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      # Rust: the protocol, engine, recorder and CLI crates.
      - name: Rust tests
        run: cargo test --locked

      # The binary that ships, and the stand-in engine the SDK tests use.
      - name: Build the release binaries
        run: cargo build --release --locked
      - name: The binaries start
        shell: bash
        run: |
          "$TRACEQA_BIN" --version
          "$TRACEQA_BIN" extract --help
          test -f "$TRACEQA_REPLAY_BIN"

      # Python: the drivers, the protocol package and the SDK, against real browsers.
      - name: Install the Python packages
        run: uv sync --locked
      - name: Install browsers
        run: uv run playwright install --with-deps chromium firefox webkit
      - name: Find chromedriver
        shell: bash
        run: |
          # GitHub's machines ship chromedriver next to a matching Chrome. Its folder is named by
          # CHROMEWEBDRIVER, spelled ChromeWebDriver on some Windows images; PATH is the last resort.
          name="chromedriver${{ runner.os == 'Windows' && '.exe' || '' }}"
          found=""
          for dir in "${CHROMEWEBDRIVER:-}" "${ChromeWebDriver:-}" "C:/SeleniumWebDrivers/ChromeDriver"; do
            if [ -n "$dir" ] && [ -f "$dir/$name" ]; then found="$dir/$name"; break; fi
          done
          [ -n "$found" ] || found="$(command -v "$name" || true)"
          if [ -z "$found" ]; then
            echo "chromedriver not found. CHROMEWEBDRIVER='${CHROMEWEBDRIVER:-}'"
            env | grep -i chrome || true
            exit 1
          fi
          echo "chromedriver: $found"
          echo "TRACEQA_CHROMEDRIVER=$found" >> "$GITHUB_ENV"
      - name: Python tests
        run: uv run pytest

      # TypeScript: the SDK against the release binary, real browsers and the transcripts.
      - name: Put the drivers and the workspace's Python on PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}" >> "$GITHUB_PATH"
      - name: TypeScript tests
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test

      # End to end: the binary, a driver, three browsers and the collector on the demo site.
      - name: Bench
        run: uv run bench/run.py --json bench-scores.json

      - name: Upload the bench scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-scores-${{ matrix.os }}
          path: bench-scores.json
          if-no-files-found: ignore
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
