[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The oldest compiler that builds the workspace with its locked dependencies (sha2 0.11, image and the
# icu crates need 1.88). CI builds with exactly this version. Raise it deliberately: docs/releasing.md.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/thearpankumar/TraceQA"

[workspace.dependencies]
traceqa-protocol = { path = "crates/traceqa-protocol" }
traceqa-engine = { path = "crates/traceqa-engine" }
traceqa-recorder = { path = "crates/traceqa-recorder" }
traceqa-mcp = { path = "crates/traceqa-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
