<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pattern: product grid</title>
<style>
  body { font: 14px sans-serif; display: flex; gap: 24px; }
  ul.grid { list-style: none; display: grid; grid-template-columns: repeat(4, 200px); gap: 12px; padding: 0; }
  .card { border: 1px solid #ccc; padding: 8px; }
</style>
<script type="application/json" id="expected-components">
[
  {"role": "checkbox", "name": "Shirts", "instances": 1},
  {"role": "checkbox", "name": "Accessories", "instances": 1},
  {"role": "checkbox", "name": "Outerwear", "instances": 1},
  {"role": "combobox", "name": "Sort by", "instances": 1},
  {"role": "link", "name": "*", "template": true, "instances": 8},
  {"role": "button", "name": "Add to cart", "instances": 8},
  {"role": "button", "name": "Add to wishlist", "instances": 8},
  {"role": "button", "name": "Load more", "instances": 1}
]
</script>
<body>
<aside aria-label="Filters">
  <fieldset><legend>Category</legend>
    <label><input id="pg-filter-shirts" type="checkbox" data-expect="role=checkbox; name=Shirts"> Shirts</label>
    <label><input type="checkbox"> Accessories</label>
    <label><input type="checkbox"> Outerwear</label>
  </fieldset>
</aside>
<main>
  <label for="pg-sort">Sort by</label>
  <select id="pg-sort" data-expect="role=combobox; name=Sort by"><option>Newest</option><option>Price</option></select>
  <ul class="grid" aria-label="Products">
    <li class="card">
      <a href="/p/1" id="pg-title-1" data-expect="role=link; name=Linen shirt; template=true; instances=8">Linen shirt</a>
      <p>Rs 599</p>
      <button id="pg-cart-1" data-expect="name=Add to cart; instances=8">Add to cart</button>
      <button aria-label="Add to wishlist" id="pg-wish-1" data-expect="name=Add to wishlist; instances=8">heart</button>
    </li>
    <li class="card">
      <a href="/p/2">Wool scarf</a>
      <p>Rs 699</p>
      <button>Add to cart</button>
      <button aria-label="Add to wishlist">heart</button>
    </li>
    <li class="card">
      <a href="/p/3">Canvas tote</a>
      <p>Rs 799</p>
      <button>Add to cart</button>
      <button aria-label="Add to wishlist">heart</button>
    </li>
    <li class="card">
      <a href="/p/4">Leather belt</a>
      <p>Rs 899</p>
      <button>Add to cart</button>
      <button aria-label="Add to wishlist">heart</button>
    </li>
    <li class="card">
      <a href="/p/5">Cotton socks</a>
      <p>Rs 999</p>
      <button>Add to cart</button>
      <button aria-label="Add to wishlist">heart</button>
    </li>
    <li class="card">
      <a href="/p/6">Denim jacket</a>
      <p>Rs 1099</p>
      <button>Add to cart</button>
      <button aria-label="Add to wishlist">heart</button>
    </li>
    <li class="card">
      <a href="/p/7">Silk tie</a>
      <p>Rs 1199</p>
      <button>Add to cart</button>
      <button aria-label="Add to wishlist">heart</button>
    </li>
    <li class="card">
      <a href="/p/8">Rain hat</a>
      <p>Rs 1299</p>
      <button>Add to cart</button>
      <button aria-label="Add to wishlist">heart</button>
    </li>
  </ul>
  <button id="pg-more" data-expect="name=Load more">Load more</button>
</main>
</body>
</html>
