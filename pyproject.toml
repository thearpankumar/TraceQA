[project]
name = "traceqa-workspace"
version = "0.1.0"
description = "Python side of the TraceQA monorepo. Not published: the packages live in python/."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "traceqa-protocol",
    "traceqa-driver-playwright",
    "traceqa-driver-webdriver",
    "traceqa",
    "datamodel-code-generator>=0.26",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
    "mcp>=1.9",
    "jsonschema>=4.18",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*", "drivers/*", "sdks/python"]

[tool.uv.sources]
traceqa-protocol = { workspace = true }
traceqa-driver-playwright = { workspace = true }
traceqa-driver-webdriver = { workspace = true }
traceqa = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["python", "collector", "drivers", "sdks", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
# Generated files.
extend-exclude = [
    "python/traceqa-protocol/src/traceqa_protocol/models.py",
    "python/traceqa-protocol/src/traceqa_protocol/contracts.py",
]

[tool.ruff.lint]
# Stated here so a contributor's own ruff settings cannot change what CI checks.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job
