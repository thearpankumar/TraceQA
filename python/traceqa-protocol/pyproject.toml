[project]
name = "traceqa-protocol"
version = "0.1.0"
description = "TraceQA message and file types, generated from spec/."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceqa_protocol"]
