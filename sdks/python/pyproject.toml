[project]
name = "traceqa"
version = "0.1.0"
description = "Python client for TraceQA. It starts the traceqa engine and talks to it; all logic lives in the engine."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["traceqa-protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceqa"]

[tool.uv.sources]
traceqa-protocol = { workspace = true }
