[project]
name = "traceqa"
version = "0.1.0"
description = "Python client for TraceQA. It starts the traceqa engine and talks to it; all logic lives in the engine."
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
keywords = ["traceqa", "testing", "qa", "browser", "components", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = ["traceqa-protocol==0.1.0"]

[project.urls]
Homepage = "https://github.com/thearpankumar/TraceQA/tree/master/sdks/python#readme"
Repository = "https://github.com/thearpankumar/TraceQA"
Issues = "https://github.com/thearpankumar/TraceQA/issues"
Documentation = "https://github.com/thearpankumar/TraceQA/blob/master/docs/usage.md#python-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceqa"]

[tool.uv.sources]
traceqa-protocol = { workspace = true }
