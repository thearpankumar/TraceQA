<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Act fixture</title></head>
<body>
  <h1>Act fixture</h1>
  <!-- One control for each thing an action can cause. A test names the id it needs. -->
  <a id="go" href="/next.html">Go to the next page</a>
  <button id="alert" onclick="alert('Hello from the page')">Alert</button>
  <button id="confirm" onclick="document.getElementById('answer').textContent = String(confirm('Sure?'))">Confirm</button>
  <span id="answer"></span>
  <button id="popup" onclick="window.open('/next.html?token=SECRET#frag')">Popup</button>
  <a id="download" href="/files/receipt.txt?token=SECRET">Download</a>
  <button id="throws" onclick="throw new Error('handler failed')">Throws</button>
  <button id="logs" onclick="console.error('boom at https://example.test/p?token=SECRET')">Logs</button>
  <button id="fetch500" onclick="fetch('/api/fail?token=SECRET')">Fetch 500</button>
  <button id="fetchdrop" onclick="fetch('/api/drop?token=SECRET')">Fetch dropped</button>
  <button id="fetchok" onclick="fetch('/api/ok')">Fetch ok</button>
  <button id="grow" onclick="document.getElementById('list').appendChild(document.createElement('li')).textContent = 'new'">Grow</button>
  <ul id="list"></ul>
  <button id="dead">Dead</button>
  <!-- Things that write. A read-only session must stop every one of them before it leaves the browser. -->
  <form id="form" method="post" action="/checkout"><button id="continue">Continue</button></form>
  <button id="fetchpost" onclick="fetch('/api/post', { method: 'POST', body: 'x' })">Fetch POST</button>
  <button id="fetchdelete" onclick="fetch('/api/post', { method: 'DELETE' })">Fetch DELETE</button>
  <button id="beacon" onclick="navigator.sendBeacon('/api/beacon', 'x')">Beacon</button>
  <button id="websocket" onclick="try { var s = new WebSocket('ws://' + location.host + '/ws'); s.onopen = function () { document.getElementById('status').textContent = 'open'; }; s.onclose = function () { document.getElementById('status').textContent = 'closed'; }; s.onerror = function () { document.getElementById('status').textContent = 'error'; }; } catch (e) { document.getElementById('status').textContent = 'threw'; }">WebSocket</button>
  <button id="worker" onclick="var out = document.getElementById('status'); try { navigator.serviceWorker.register('/sw.js').then(function () { out.textContent = 'registered'; }, function (e) { out.textContent = 'refused ' + e.name; }); } catch (e) { out.textContent = 'refused ' + e.name; }">Service worker</button>
  <a id="outside" href="/next.html">Another site</a>
  <a id="outside-blank" href="/next.html" target="_blank">Another site, in a new tab</a>
  <a id="download-blank" href="/files/receipt.txt" target="_blank">A download, in a new tab</a>
  <span id="status"></span>
  <button id="disabled" disabled>Disabled</button>
  <button id="hovered" onmouseover="this.dataset.hovered = 'yes'">Hover me</button>
  <label>Name <input id="name"></label>
  <label>Size
    <select id="size"><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option></select>
  </label>
  <input id="keys" aria-label="Keys" onkeydown="document.getElementById('keylog').textContent += event.key + ';'">
  <span id="keylog"></span>
  <div id="host"></div>
  <iframe id="frame" name="inner" src="/frame.html" title="Inner"></iframe>
  <script>
    var root = document.getElementById('host').attachShadow({ mode: 'open' });
    root.innerHTML = '<button id="shadow-button" onclick="this.textContent = \'clicked\'">Shadow</button>';
  </script>
</body>
</html>
