<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pattern: accordion</title>
<style>body { font: 14px sans-serif; } [hidden] { display: none; }</style>
<script type="application/json" id="expected-components">
[
  {"role": "button", "name": "How long does shipping take?", "instances": 1},
  {"role": "link", "name": "Shipping rates", "instances": 1},
  {"role": "button", "name": "Can I return an item?", "instances": 1},
  {"role": "link", "name": "Start a return", "instances": 1},
  {"role": "button", "name": "Do you ship abroad?", "instances": 1},
  {"role": "button", "name": "Billing", "instances": 1},
  {"role": "link", "name": "Update card", "instances": 1}
]
</script>
<body>
<main>
  <h1>Questions</h1>
  <details open>
    <summary id="acc-shipping" data-expect="role=button; name=How long does shipping take?; expanded=true">How long does shipping take?</summary>
    Three to five days. <a id="acc-rates" href="/rates" data-expect="visible=true">Shipping rates</a>
  </details>
  <details>
    <summary id="acc-returns" data-expect="expanded=false">Can I return an item?</summary>
    Within 30 days. <a id="acc-return-link" href="/returns" data-expect="name=Start a return; visible=false">Start a return</a>
  </details>
  <details><summary>Do you ship abroad?</summary>Yes, to most countries.</details>
  <h2>Account</h2>
  <button id="acc-billing" aria-expanded="false" aria-controls="acc-billing-panel"
    data-expect="role=button; name=Billing; expanded=false">Billing</button>
  <div id="acc-billing-panel" role="region" aria-label="Billing" hidden>
    <a id="acc-card" href="/card" data-expect="visible=false">Update card</a></div>
</main>
</body>
</html>
